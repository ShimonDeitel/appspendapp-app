name: Appspend
options:
  bundleIdPrefix: com.shimondeitel.appspendapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Appspend:
    type: application
    platform: iOS
    sources:
      - path: Appspend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.appspendapp
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Appspend/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  AppspendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppspendTests
    dependencies:
      - target: Appspend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.appspendapp.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  AppspendUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppspendUITests
    dependencies:
      - target: Appspend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.appspendapp.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Appspend:
    build:
      targets:
        Appspend: all
        AppspendTests: [test]
        AppspendUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Appspend.storekit
    test:
      config: Debug
      storeKitConfiguration: Appspend.storekit
      targets:
        - AppspendTests
        - AppspendUITests
    archive:
      config: Release
